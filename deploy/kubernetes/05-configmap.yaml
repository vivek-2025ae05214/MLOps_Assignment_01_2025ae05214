apiVersion: v1
kind: ConfigMap
metadata:
  name: heart-disease-api-config
  namespace: heart-disease-api
  labels:
    app: heart-disease-api
data:
  # Application configuration
  LOG_LEVEL: "INFO"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  
  # API configuration
  API_TITLE: "Heart Disease Prediction API"
  API_VERSION: "1.0.0"
  
  # Model configuration
  DEFAULT_MODEL: "random_forest"
  BATCH_SIZE_MAX: "100"
