apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  namespace: heart-disease-api
  labels:
    app: heart-disease-api
  annotations:
    description: "Heart Disease Prediction API Service"
spec:
  type: LoadBalancer
  selector:
    app: heart-disease-api
  
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  
  # Session affinity for better performance
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
